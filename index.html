<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Q2 DRILL 2</title>

    <style>
        body{
            text-align: center;
            background-image: url(https://i.pinimg.com/736x/17/ed/e9/17ede9acb61c09989b70d25e29cf85c5.jpg);
            background-size: 1300px;
            margin: 0px;
            font-family: fantasy;
        }
        h1{
            color: rgb(229, 217, 249);
            border: 3px solid rgb(230, 223, 242);
            border-radius: 15px;
            background-color: rgb(245, 245, 236);
            padding: 30px, 10px;
            margin: 30px;

        }

        #output1{
            border: 5px solid rgb(230, 223, 242);
            box-shadow: 0px 5px 5px rgb(200, 200, 200); 
            height: 700px;
            border-radius: 10px;font-size: 20px;
            background-color: rgb(245, 245, 236);
            color: rgb(230, 223, 242);
            padding: 15px;
            font-family: fantasy;
            font-weight: 600;
            
        }

        input{
            width: 280px;
            padding: 10px;
            margin: 5px;
            border: 2px solid rgb(230, 223, 242);
            border-radius: 12px;
            font-family: cursive;
        }

        button{
            font-family: fantasy;
            color: rgb(230, 223, 242);
            padding: 10px;
            margin: 3px;
            width: 150px;
            border: 2px solid rgb(230, 223, 242);
            border-radius: 12px;
            background-color: rgb(245, 245, 236);

        }
    </style>

</head>
<body>
    <h1>INVITE NEW CLUB MEMBER TO THE RAINBOW CATERING CLUB:</h1>

    <form class="form" onsubmit="return false;">
        <input type="text" id="first_name" placeholder="Enter your first name">
        
        <br>

        <input type="text" id="last_name" placeholder="Enter your last name">
        
        <br>

        <button type="button" py-click="invite_members">SUBMIT</button> 
        
    </form>

    <div id="output1"></div>
    <script type="py" src="main.py"></script>
</body>
</html>
